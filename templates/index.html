
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERIFICA LOCAL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: #071426;
    color: white;
    font-family: Arial, sans-serif;
}

main {
    max-width: 700px;
    margin: 50px auto;
    padding: 28px;
    background: #10243d;
    border-radius: 18px;
}

h1 {
    color: #53b7ff;
    text-align: center;
    font-size: 32px;
}

p {
    text-align: center;
    color: #c5d7e8;
}

textarea {
    width: 100%;
    height: 160px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #34516e;
    background: #f5f8fc;
    font-size: 16px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    background: #1689e8;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#resultado {
    display: none;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #071426;
    padding: 18px;
    border-radius: 10px;
    margin-top: 20px;
    line-height: 1.6;
}

footer {
    text-align: center;
    color: #8298ae;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>
<main>
    <h1>VERIFICA LOCAL</h1>

    <p>Comprueba una noticia antes de compartirla.</p>

    <form id="formulario">
        <textarea
            id="noticia"
            placeholder="Pega aquí la noticia que quieres verificar..."
            required
        ></textarea>

        <button id="boton" type="submit">
            VERIFICAR NOTICIA
        </button>
    </form>

    <div id="resultado"></div>

    <footer>
        VERIFICA LOCAL | Información antes de compartir
    </footer>
</main>

<script>
const formulario = document.getElementById("formulario");
const noticia = document.getElementById("noticia");
const boton = document.getElementById("boton");
const resultado = document.getElementById("resultado");

formulario.addEventListener("submit", async function(event) {
    event.preventDefault();

    const texto = noticia.value.trim();

    if (!texto) {
        resultado.style.display = "block";
        resultado.textContent = "Escribe una noticia primero.";
        return;
    }

    boton.disabled = true;
    boton.textContent = "ANALIZANDO...";
    resultado.style.display = "block";
    resultado.textContent = "Estamos investigando la noticia. Espera un momento...";

    try {
        const respuesta = await fetch("/api/verificar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                noticia: texto
            })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(datos.error || "Error al verificar.");
        }

        resultado.textContent = datos.resultado ||
            "No se recibió un resultado válido.";

    } catch (error) {
        resultado.textContent =
            "No se pudo completar la verificación: " + error.message;

    } finally {
        boton.disabled = false;
        boton.textContent = "VERIFICAR NOTICIA";
    }
});
</script>

</body>
</html>
